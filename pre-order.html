<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre Order | Cherish Every Bite</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/sidebar.css" />
</head>
<body class="preorder-page">
  <header class="site-header">
    <div class="container nav">
      <div class="brand"><h1>Pre Order</h1></div>
      <div class="nav-actions">
        <a class="btn btn-soft" href="index.html">Home</a>
        <a class="btn btn-soft" href="menu.html">Our Menu</a>
        <a class="btn btn-soft" href="plans.html">Subscription Plans</a>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container card preorder-shell">
      <h2>Pre-order for a specific date</h2>
      <p class="muted">Select a delivery date within the next 3 months, then add any menu items.</p>
      <div class="controls" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
        <div>
          <label for="preorder-date">Delivery Date</label>
          <input id="preorder-date" type="date" />
        </div>
        <div>
          <label for="preorder-name">Name</label>
          <input id="preorder-name" type="text" placeholder="Your full name" />
        </div>
        <div>
          <label for="preorder-phone">Mobile</label>
          <input id="preorder-phone" type="tel" placeholder="WhatsApp number" />
        </div>
        <div>
          <label for="preorder-location">Delivery Location</label>
          <select id="preorder-location"></select>
        </div>
        <div>
          <label for="preorder-map-link">Pinned Map Link</label>
          <input id="preorder-map-link" type="url" placeholder="Paste Google/Apple map link with coordinates" />
        </div>
        <div>
          <label>Pin on Map</label>
          <a id="preorder-pick-location" class="btn btn-soft" href="map-picker.html">Select Delivery Location</a>
        </div>
      </div>
      <p id="preorder-feedback" class="muted preorder-feedback"></p>
      <div id="preorder-category-bar" class="preorder-category-bar"></div>
      <div id="preorder-menu" class="menu-grid"></div>
      <a id="preorder-confirm" class="btn btn-primary preorder-confirm-floating" href="#" target="_blank" rel="noopener">Confirm Pre Order</a>
    </div>
  </section>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/pre-order.js"></script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
