<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Plans | Cherish Every Bite</title>
  <link rel="stylesheet" href="assets/css/plan.css" />
  <link rel="stylesheet" href="assets/css/sidebar.css" />
</head>
<body>
  <header>
    <div class="container nav">
      <a class="btn btn-soft" href="index.html">Home</a>
      <a class="btn btn-soft" href="menu.html">Our Menu</a>
      <a class="btn btn-soft" href="plans.html">Subscription Plans</a>
        <a class="btn btn-soft" href="pre-order.html">Pre Order</a>
      <a class="btn btn-red" href="https://order.cherisheverybite.com/outlet/56752198194843" target="_blank" rel="noopener">Order Now</a>
    </div>
  </header>

  <main class="container hero">
    <section class="hero-card">
      <h1>Subscription Plans</h1>
      <p class="muted">Choose your preferences and continue to the subscription calendar.</p>
      <section class="controls" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px;">
        <div>
          <label for="plan-period-select">Duration</label>
          <select id="plan-period-select">
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div>
          <label for="plan-meal-select">Meal Slot</label>
          <select id="plan-meal-select">
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>
        <div>
          <label for="plan-variant-select">Food Preference</label>
          <select id="plan-variant-select">
            <option value="veg">Veg</option>
            <option value="nonveg">Non-Veg</option>
            <option value="standard">Standard</option>
          </select>
        </div>
      </section>
      <div id="plans-grid" class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 20px;"></div>
    </section>
  </main>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/plans-page.js"></script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
